name: Hämta Strava

on:
  schedule:
    - cron: "7,37 * * * *"   # två gånger i timmen
  workflow_dispatch:          # kör manuellt från fliken Actions

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta pass
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          EASY_HR: ${{ vars.EASY_HR }}
          TZ: Europe/Stockholm
        run: python scripts/fetch_strava.py
      - name: Spara om något ändrats
        run: |
          git config user.name "strava-bot"
          git config user.email "actions@users.noreply.github.com"
          git add training.json
          git diff --cached --quiet || (git commit -m "Uppdatera träning" && git push)
